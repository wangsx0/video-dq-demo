<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>视频的题头</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            max-width: 100%;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <video controls preload="metadata">
        <source src="./video.mp4" type="video/mp4">
        浏览器不支持视频播放
    </video>
</body>
</html>
