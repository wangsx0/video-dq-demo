<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>视频播放</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            max-width: 100%;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <video controls playsinline preload="metadata">
        <source src="https://cdn.jsdelivr.net/gh/wangsx0/video-dq-demo@master/video.mp4#t=0.001" type="video/mp4">
        浏览器不支持HTML视频，请<a href="https://cdn.jsdelivr.net/gh/wangsx0/video-dq-demo@master/video.mp4">点击下载</a>
    </video>
</body>
</html>
