<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>阿涛炸清</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .video-wrap {
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255,255,255,0.15);
            border-radius: 8px;
            overflow: hidden;
        }
        video {
            display: block;
            width: 100%;
            height: auto;
        }
        .tip {
            color:#aaa;
            margin-top:16px;
            font-size:14px;
            text-align:center;
        }
    </style>
</head>
<body>
    <div class="video-wrap">
        <video 
            controls 
            playsinline 
            preload="metadata"
            muted
        >
            <source src="./video.mp4" type="video/mp4">
            <p style="color:#fff;padding:20px;text-align:center;">
                浏览器不支持HTML视频，请<a href="./video.mp4" style="color:#409eff;">点击下载视频</a>
            </p>
        </video>
    </div>
    <div class="tip">2026年9月13日 阿涛炸清</div>
</body>
</html>
